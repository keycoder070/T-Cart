<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="products">

    <div class="product">
        <h3>Smartphone</h3>
        <p>Price: ₹25,000</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="product">
        <h3>Laptop</h3>
        <p>Price: ₹55,000</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="product">
        <h3>Headphones</h3>
        <p>Price: ₹2,500</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="product">
        <h3>Smart Watch</h3>
        <p>Price: ₹4,999</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>
</section>

<footer>
    <p>© 2026 TechKart | Online Electronics Store</p>
</footer>

<script src="script.js"></script>

</body>
</html>
